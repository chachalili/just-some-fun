
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Just Some Fun - App Library</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f3f5f9;
    color: #243247;
  }

  header {
    background: #173753;
    color: white;
    padding: 45px 8%;
  }

  main {
    max-width: 1150px;
    margin: auto;
    padding: 35px 25px;
  }

  .grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }

  .card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 3px 12px #00000012;
  }

  .card p {
    color: #64748b;
    line-height: 1.5;
  }

  .btn {
    display: inline-block;
    margin-top: 10px;
    padding: 11px 18px;
    background: #176ba0;
    color: white;
    text-decoration: none;
    border-radius: 7px;
  }
</style>
</head>
<body>

<header>
  <h1>Just Some Fun</h1>
  <p>Architecture AI Tools Hub</p>
  <p>Thư viện ứng dụng và thử nghiệm công nghệ</p>
</header>

<main>
  <h2>Danh sách ứng dụng</h2>

  <div class="grid">
    <div class="card">
      <h3>Workflow Simulator</h3>
      <p>Mô phỏng quy trình làm việc AI và n8n.</p>
      <a class="btn"
         href="apps/workflow-simulator/">
         Mở ứng dụng
      </a>
    </div>
  </div>
</main>

</body>
</html>
